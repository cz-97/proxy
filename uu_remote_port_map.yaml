mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: UU端口映射
    type: socks5
    server: 127.0.0.1
    port: 7893

proxy-groups:
  - name: proxy
    type: select
    proxies:
      - UU端口映射

rule-providers:
  预代理:
    behavior: classical
    type: http
    format: text
    url: https://raw.githubusercontent.com/cz-97/proxy/main/rules/pre_proxy.txt
    path: ./预代理.txt
    interval: 86400

  我的代理:
    behavior: classical
    type: http
    format: text
    url: https://raw.githubusercontent.com/cz-97/proxy/main/rules/proxy.txt
    path: ./我的代理.txt
    interval: 86400

  我的直连:
    behavior: classical
    type: http
    format: text
    url: https://raw.githubusercontent.com/cz-97/proxy/main/rules/direct.txt
    path: ./我的直连.txt
    interval: 86400

  广告:
    behavior: classical
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml
    path: ./ruleset/广告.yaml
    interval: 86400

  非中国顶域:
    behavior: domain
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt
    path: ./ruleset/非中国顶域.yaml
    interval: 86400

  纸飞机:
    behavior: classical
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.yaml
    path: ./ruleset/纸飞机.yaml
    interval: 86400

  远程直连:
    behavior: domain
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    path: ./ruleset/远程直连.yaml
    interval: 86400

  大陆IP:
    behavior: ipcidr
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    path: ./ruleset/大陆IP.yaml
    interval: 86400

  私有域:
    behavior: domain
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    path: ./ruleset/私有域.yaml
    interval: 86400

  局域网IP及保留IP:
    behavior: ipcidr
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt
    path: ./ruleset/局域网IP及保留IP.yaml
    interval: 86400

  远程代理:
    behavior: domain
    type: http
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    path: ./ruleset/远程代理.yaml
    interval: 86400

rules:
  - RULE-SET,广告,REJECT
  - DOMAIN-KEYWORD,vdownload,proxy
  - RULE-SET,预代理,proxy
  - RULE-SET,远程直连,DIRECT
  - RULE-SET,私有域,DIRECT
  - RULE-SET,大陆IP,DIRECT
  - RULE-SET,局域网IP及保留IP,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - RULE-SET,我的直连,proxy
  - RULE-SET,纸飞机,proxy
  - RULE-SET,我的代理,proxy
  - RULE-SET,远程代理,proxy
  - RULE-SET,非中国顶域,proxy
  - MATCH,proxy
